[project]
name = "lab-supply"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = []

[tool.unittest]
start-directory = "tests"

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lab_supply", "lab_supply.fixtures"]

[tool.setuptools.package-dir]
"lab_supply.fixtures" = "fixtures"

[tool.setuptools.package-data]
"lab_supply.fixtures" = ["*.json"]
